<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yönetim Paneli - Adam Asmaca</title>
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800&f[]=satoshi@400,500,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css?v=40">
<script type="module" src="./firebase.js"></script>
<style>
  body { min-height: 100svh; display: flex; flex-direction: column; align-items: center; padding: var(--space-4); gap: 0; }

  /* AUTH GUARD */
  #auth-guard { display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--space-6); min-height: 60vh; text-align: center; }
  #auth-guard.visible { display: flex; }
  #panel-root { display: none; width: 100%; max-width: 720px; flex-direction: column; gap: var(--space-6); }
  #panel-root.visible { display: flex; }

  /* CARDS */
  .panel-card { background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius-xl); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); }
  .panel-card-title { font-size: var(--text-md); font-weight: 800; display: flex; align-items: center; gap: var(--space-2); }

  /* USERS TABLE */
  .users-table-container { width: 100%; overflow-x: auto; }
  .users-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  .users-table th { text-align: left; padding: var(--space-2) var(--space-3);
    color: var(--color-text-muted); font-weight: 600; border-bottom: 1px solid var(--color-border); }
  .users-table td { padding: var(--space-3); border-bottom: 1px solid var(--color-border); vertical-align: middle; }
  .users-table tr:last-child td { border-bottom: none; }
  .users-table tr:hover td { background: var(--color-surface-offset); }
  
  .role-select {
    background: var(--color-surface-offset); border: 1px solid var(--color-border);
    color: var(--color-text); border-radius: var(--radius-sm); padding: 4px 8px; font-size: 13px;
    cursor: pointer;
  }
  .role-select:focus { outline: none; border-color: var(--color-primary); }
  
  .save-role-btn {
    padding: 4px 10px; font-size: 12px; background: var(--color-primary); color: var(--color-surface);
    border: none; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; margin-left: 8px;
    opacity: 0.5; pointer-events: none; transition: opacity 0.2s;
  }
  .save-role-btn.active { opacity: 1; pointer-events: auto; }

  /* EMPTY STATE */
  .empty-state { display: flex; flex-direction: column; align-items: center; gap: var(--space-3);
    padding: var(--space-8); color: var(--color-text-muted); text-align: center; }

  /* LOADER */
  .loader { display: inline-block; width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.2);
    border-radius: 50%; border-top-color: var(--color-primary); animation: spin 1s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: var(--color-border); }
</style>
</head>
<body>

<div class="header" style="width:100%;max-width:720px;">
  <div class="logo">
    <svg class="logo-icon" viewBox="0 0 36 36" fill="none" aria-label="Adam Asmaca">
      <rect x="4" y="6" width="4" height="24" rx="2" fill="currentColor" opacity="0.3"/>
      <rect x="4" y="6" width="14" height="4" rx="2" fill="currentColor" opacity="0.5"/>
      <rect x="16" y="6" width="2" height="6" rx="1" fill="currentColor"/>
      <circle cx="17" cy="16" r="3.5" stroke="currentColor" stroke-width="2" fill="none"/>
      <line x1="17" y1="19.5" x2="17" y2="26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="17" y1="21" x2="13" y2="24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="17" y1="21" x2="21" y2="24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="17" y1="26" x2="13" y2="30" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="17" y1="26" x2="21" y2="30" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div class="logo-text" style="cursor:pointer;" onclick="location.href='index.html'">
      <span>Adam Asmaca</span>
      <span>Yönetim Paneli</span>
    </div>
  </div>
  <div class="header-right">
    <button class="nav-icon-btn" onclick="window.location.href='./index.html'" title="Geri Dön" aria-label="Geri">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
  </div>
</div>

<!-- AUTH GUARD -->
<div id="auth-guard" class="visible">
  <div class="loader"></div>
  <h2 style="font-size:var(--text-lg);font-weight:800;">Yetki Kontrolü...</h2>
  <p style="color:var(--color-text-muted);">Yönetici yetkiniz kontrol ediliyor.</p>
</div>

<!-- PANEL ROOT -->
<div id="panel-root">
  <div class="panel-card">
    <h2 class="panel-card-title"><span style="font-size:1.6rem;">⚙️</span> Sistem Kullanıcıları</h2>
    <p style="color:var(--color-text-muted);font-size:13px;margin-bottom:var(--space-2);">Sistemdeki kullanıcıları görüntüleyin ve yetkilerini düzenleyin. (Not: Kendinizin admin yetkisini alırsanız sayfaya tekrar erişemezsiniz!)</p>
    
    <div class="users-table-container">
      <table class="users-table">
        <thead>
          <tr>
            <th style="width:50px;"></th>
            <th>Kullanıcı</th>
            <th>Rol & İşlem</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td colspan="3" style="text-align:center;padding:var(--space-4);"><div class="loader"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script type="module">
  let allUsers = [];

  function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>'"]/g, tag => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[tag] || tag));
  }

  // Toast Notification
  function showNotificationToast(msg) {
    let t = document.getElementById("notification-toast");
    if (!t) {
      t = document.createElement("div");
      t.id = "notification-toast";
      t.className = "toast";
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 3000);
  }

  function renderTable() {
    const tbody = document.getElementById("users-tbody");
    if (allUsers.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state"><span class="empty-state-icon">👥</span><p>Henüz kullanıcı bulunmuyor.</p></div></td></tr>`;
      return;
    }

    tbody.innerHTML = allUsers.map((u, i) => {
      const role = u.role || 'student';
      const roleStr = escapeHtml(role);
      const name = escapeHtml(u.displayName || 'Bilinmiyor');
      const email = escapeHtml(u.email || '-');
      const photo = u.photoURL ? escapeHtml(u.photoURL) : '';
      
      return `
        <tr>
          <td>
            ${photo ? `<img src="${photo}" class="user-avatar" alt="avatar">` : `<div class="user-avatar" style="display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;color:var(--color-text);">${name.charAt(0)}</div>`}
          </td>
          <td>
            <div style="font-weight:600;">${name}</div>
            <div style="color:var(--color-text-muted);font-size:12px;margin-top:2px;">${email}</div>
          </td>
          <td>
            <div style="display:flex;align-items:center;">
              <select class="role-select" data-index="${i}" data-original="${roleStr}">
                <option value="student" ${roleStr === 'student' ? 'selected' : ''}>Öğrenci</option>
                <option value="teacher" ${roleStr === 'teacher' ? 'selected' : ''}>Öğretmen</option>
                <option value="admin" ${roleStr === 'admin' ? 'selected' : ''}>Admin</option>
              </select>
              <button class="save-role-btn" data-index="${i}" data-uid="${escapeHtml(u.uid)}">Kaydet</button>
            </div>
          </td>
        </tr>
      `;
    }).join("");

    // Olay dinleyicileri ekle
    document.querySelectorAll(".role-select").forEach(sel => {
      sel.addEventListener("change", (e) => {
        const i = e.target.getAttribute("data-index");
        const orig = e.target.getAttribute("data-original");
        const btn = document.querySelector(`.save-role-btn[data-index="${i}"]`);
        if (e.target.value !== orig) {
          btn.classList.add("active");
        } else {
          btn.classList.remove("active");
        }
      });
    });

    document.querySelectorAll(".save-role-btn").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        const i = e.target.getAttribute("data-index");
        const uid = e.target.getAttribute("data-uid");
        const sel = document.querySelector(`.role-select[data-index="${i}"]`);
        const newRole = sel.value;
        
        btn.textContent = "⌛";
        btn.disabled = true;
        
        const success = await window.FB.updateUserRole(uid, newRole);
        if (success) {
          showNotificationToast("Kullanıcı rolü başarıyla güncellendi.");
          sel.setAttribute("data-original", newRole);
          allUsers[i].role = newRole;
        } else {
          showNotificationToast("Rol güncellenirken hata oluştu!");
          sel.value = sel.getAttribute("data-original");
        }
        
        btn.textContent = "Kaydet";
        btn.disabled = false;
        btn.classList.remove("active");
      });
    });
  }

  async function loadData() {
    allUsers = await window.FB.getAllUsers();
    renderTable();
  }

  function waitForFB(ms = 2000) {
    return new Promise(res => {
      if (window.FB) return res(true);
      const t = setTimeout(() => res(false), ms);
      window.addEventListener("firebase-ready", () => { clearTimeout(t); res(true); }, { once: true });
    });
  }

  async function init() {
    const ok = await waitForFB();
    if (!ok) {
      document.getElementById("auth-guard").innerHTML = `<h2 style="color:var(--color-error);">Bağlantı Hatası</h2><p>Firebase bağlanamadı. İnternet bağlantınızı kontrol edin.</p>`;
      return;
    }

    window.FB.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = './index.html';
        return;
      }
      
      const role = await window.FB.getRole(user.uid);
      if (role !== "admin") {
        document.getElementById("auth-guard").innerHTML = `<h2 style="color:var(--color-error);">Yetkisiz Erişim</h2><p>Yönetici paneline girmek için admin yetkiniz bulunmuyor.</p><button onclick="window.location.href='./index.html'" style="margin-top:20px;padding:10px 20px;border-radius:8px;border:none;background:var(--color-primary);color:var(--color-surface);font-weight:bold;cursor:pointer;">Ana Sayfaya Dön</button>`;
        return;
      }
      
      // Admin ise
      document.getElementById("auth-guard").classList.remove("visible");
      document.getElementById("panel-root").classList.add("visible");
      
      loadData();
    });
  }

  init();
</script>
</body>
</html>
