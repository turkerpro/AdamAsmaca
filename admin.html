<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Paneli - Soru Yükleme</title>
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800&f[]=satoshi@400,500,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<style>
  .admin-container { max-width: 600px; width: 100%; margin: 0 auto; background: var(--color-surface); padding: var(--space-6); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); border: 1px solid var(--color-border); }
  .form-group { margin-bottom: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
  label { font-size: var(--text-sm); font-weight: 600; color: var(--color-text-muted); }
  input, select { padding: var(--space-3); border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-surface-offset); color: var(--color-text); font-family: var(--font-body); font-size: var(--text-base); }
  input:focus, select:focus { outline: 2px solid var(--color-primary); border-color: var(--color-primary); }
  .log-box { margin-top: var(--space-4); padding: var(--space-3); background: #000; color: #0f0; font-family: monospace; font-size: 13px; border-radius: var(--radius-md); min-height: 100px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
  .btn-upload { width: 100%; padding: var(--space-4); margin-top: var(--space-4); font-size: var(--text-lg); }
  .download-link { text-align: center; margin-top: var(--space-4); display: block; color: var(--color-primary); text-decoration: underline; font-weight: 600; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <span class="logo-text">Adam Asmaca - Admin</span>
  </div>
  <a href="./index.html" class="back-btn">Oyuna Dön</a>
</div>

<div class="admin-container">
  <h2 class="screen-title" style="text-align:left; margin-bottom: 24px;">Excel'den Soru Yükle</h2>
  
  <div class="form-group">
    <label>Güvenlik Anahtarı (GitHub Token)</label>
    <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxx..." autocomplete="off">
  </div>

  <div class="form-group">
    <label>Sınıf Seçin</label>
    <select id="grade-select"><option value="">Sınıf Yükleniyor...</option></select>
  </div>

  <div class="form-group">
    <label>Ders Seçin</label>
    <select id="subject-select"><option value="">Önce sınıf seçin</option></select>
  </div>

  <div class="form-group">
    <label>CSV Dosyası (Şablona uygun)</label>
    <input type="file" id="csv-file" accept=".csv">
    <a href="./sablon.csv" class="download-link" download>👉 Örnek Şablonu (CSV) İndir</a>
  </div>

  <button class="btn-primary btn-upload" id="btn-submit">Veritabanını Güncelle</button>

  <div class="log-box" id="log-box">Hazır. Bekleniyor...</div>
</div>

<script src="./admin.js"></script>
</body>
</html>
