<body>

<div class="header">
  <div class="logo">
    <svg class="logo-icon" viewBox="0 0 36 36" fill="none" aria-label="Adam Asmaca">
      <rect x="4" y="6" width="4" height="24" rx="2" fill="currentColor" opacity="0.3"/>
      <rect x="4" y="6" width="14" height="4" rx="2" fill="currentColor" opacity="0.5"/>
      <rect x="16" y="6" width="2" height="6" rx="1" fill="currentColor"/>
      <circle cx="17" cy="16" r="3.5" stroke="currentColor" stroke-width="2" fill="none"/>
      <line x1="17" y1="19.5" x2="17" y2="26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="17" y1="21" x2="13" y2="24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="17" y1="21" x2="21" y2="24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="17" y1="26" x2="13" y2="30" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="17" y1="26" x2="21" y2="30" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="logo-text">Adam Asmaca Eğitim</span>
  </div>
  <button class="theme-toggle" data-theme-toggle aria-label="Temayı değiştir">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>
</div>

<!-- GRADE SCREEN -->
<div class="screen active" id="grade-screen">
  <h2 class="screen-title">Kaçıncı Sınıfsın?</h2>
  <p class="screen-sub">Oynamak istediğin sınıf seviyesini seç.</p>
  <div class="grid-list" id="grade-list">
    <!-- Grades will be populated here -->
  </div>
</div>

<!-- SUBJECT & UNIT SCREEN -->
<div class="screen" id="subject-screen">
  <div class="screen-header">
    <button class="back-btn" id="back-to-grades">← Geri</button>
    <h2 class="screen-title" id="selected-grade-title">Ders Seçimi</h2>
  </div>
  
  <div class="accordion-list" id="subject-list">
    <!-- Subjects and Units will be populated here -->
  </div>
</div>

<!-- GAME SCREEN -->
<div class="screen" id="game-screen">
  <div class="screen-header">
    <button class="back-btn" id="back-to-subjects">Sınıf / Ders Seç</button>
    <select id="keyboard-select" class="back-btn keyboard-select">
      <option value="qwerty">Standart (Q)</option>
      <option value="f">Standart (F)</option>
      <option value="mobile_q">Mobil (Q)</option>
      <option value="smart">Akıllı Mobil</option>
      <option value="abc">Alfabetik</option>
    </select>
  </div>
  <div class="game-card" id="game-card">
    <div class="game-header">
      <div class="category-badge" id="category-badge">Yükleniyor...</div>
      <div class="stats-row">
        <div class="score-badge">Puan: <span id="score-val">0</span></div>
        <div class="lives-bar" id="lives-bar"></div>
      </div>
    </div>

    <div class="hangman-area">
      <svg id="hangman-svg" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="20" y1="170" x2="160" y2="170" stroke="var(--color-border)" stroke-width="3" stroke-linecap="round"/>
        <line x1="50" y1="170" x2="50" y2="20" stroke="var(--color-border)" stroke-width="3" stroke-linecap="round"/>
        <line x1="50" y1="20" x2="110" y2="20" stroke="var(--color-border)" stroke-width="3" stroke-linecap="round"/>
        <line x1="110" y1="20" x2="110" y2="40" stroke="var(--color-border)" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/>
        <circle id="h-head" cx="110" cy="55" r="15" stroke="var(--color-error)" stroke-width="2.5" opacity="0" fill="none" class="body-part"/>
        <line id="h-body" x1="110" y1="70" x2="110" y2="110" stroke="var(--color-error)" stroke-width="2.5" stroke-linecap="round" opacity="0" class="body-part"/>
        <line id="h-arm-l" x1="110" y1="80" x2="88" y2="98" stroke="var(--color-error)" stroke-width="2.5" stroke-linecap="round" opacity="0" class="body-part"/>
        <line id="h-arm-r" x1="110" y1="80" x2="132" y2="98" stroke="var(--color-error)" stroke-width="2.5" stroke-linecap="round" opacity="0" class="body-part"/>
        <line id="h-leg-l" x1="110" y1="110" x2="90" y2="135" stroke="var(--color-error)" stroke-width="2.5" stroke-linecap="round" opacity="0" class="body-part"/>
        <line id="h-leg-r" x1="110" y1="110" x2="130" y2="135" stroke="var(--color-error)" stroke-width="2.5" stroke-linecap="round" opacity="0" class="body-part"/>
      </svg>
    </div>

    <div class="word-area">
      <span class="hint-text" id="hint-text">Sorular yükleniyor...</span>
      <div class="word-display" id="word-display"></div>
    </div>

    <div class="wrong-area">
      <span class="wrong-label">Yanlış:</span>
      <div class="wrong-letters" id="wrong-letters"></div>
    </div>

    <div class="keyboard-area" id="keyboard-area">
      <div class="keyboard-row" id="row-1"></div>
      <div class="keyboard-row" id="row-2"></div>
      <div class="keyboard-row" id="row-3"></div>
      <div class="keyboard-row" id="row-4"></div>
    </div>
  </div>
</div>

<script src="./main.js?v=15"></script>
</body>
</html>
