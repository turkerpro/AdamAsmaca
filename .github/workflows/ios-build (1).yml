name: iOS Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: npm install

      - name: Build web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install Pods
        run: cd ios/App && pod install

      - name: Build for Simulator
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath ./build \
            build

      - name: Boot Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 16" | head -1 | grep -E -o '[0-9A-F-]{36}')
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Install App on Simulator
        run: |
          APP_PATH=$(find ./build -name "*.app" | head -1)
          echo "APP_PATH=$APP_PATH"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

      - name: Launch App & Screenshot
        run: |
          xcrun simctl launch "$SIMULATOR_UDID" $(xcrun simctl get_app_container "$SIMULATOR_UDID" $(defaults read "$(find ./build -name Info.plist | head -1)" CFBundleIdentifier) 2>/dev/null || echo "io.ionic.starter")
          sleep 5
          mkdir -p ./screenshots
          xcrun simctl io "$SIMULATOR_UDID" screenshot ./screenshots/screen1.png
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot ./screenshots/screen2.png
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot ./screenshots/screen3.png

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: ./screenshots/*.png

      - name: Upload IPA (unsigned)
        run: |
          mkdir -p ./output/Payload
          find ./build -name "*.app" -exec cp -r {} ./output/Payload/ \;
          cd ./output && zip -r App.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ./output/*.ipa
